<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08070f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>من المحتال؟</title>
<style>
:root{
  --bg:#08070f; --ink:#f7f3ff; --mut:#9d93bd;
  --line:rgba(255,255,255,.1); --glass:rgba(255,255,255,.055);
  --gold:#ffc247; --gold2:#ff8a3d; --violet:#6b4cff; --bad:#ff5f7e;
  --pad:16px; --cta:104px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{
  margin:0;min-height:100vh;min-height:100dvh;
  font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",system-ui,sans-serif;
  background:
    radial-gradient(120% 65% at 50% -8%,#2a1d63 0%,transparent 60%),
    radial-gradient(85% 55% at 110% 108%,#3a1740 0%,transparent 55%),
    var(--bg);
  color:var(--ink);
  overscroll-behavior-y:none;
  -webkit-text-size-adjust:100%;
}
button,a,input{font-family:inherit;touch-action:manipulation}
button{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.wrap{
  max-width:480px;margin:0 auto;
  padding:calc(16px + env(safe-area-inset-top,0px)) var(--pad) calc(var(--cta) + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;gap:12px;
}
.wrap.center{min-height:100vh;min-height:100dvh;justify-content:center;text-align:center;gap:10px}
h1{font-size:clamp(30px,9vw,38px);margin:6px 0 4px;line-height:1.15;letter-spacing:-.5px}
h2{font-size:clamp(19px,5.4vw,23px);margin:8px 0;font-weight:800}
.hero p{color:var(--mut);line-height:1.65;margin:0;font-size:14.5px}
.badge{display:inline-block;align-self:flex-start;font-size:12px;padding:6px 11px;border-radius:99px;border:1px solid var(--line);color:var(--mut);background:var(--glass)}
.card{background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:2px 14px;margin:0}
.card>.lbl{padding-top:14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);min-height:60px}
.row:last-child{border-bottom:0}
.lbl{font-weight:700;font-size:15.5px;line-height:1.35}
.hint{color:var(--mut);font-size:13px;margin-top:2px;line-height:1.5}
.stepper{display:flex;align-items:center;gap:8px;flex:none}
.stepper button{width:46px;height:46px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.07);color:var(--ink);font-size:23px;line-height:1;cursor:pointer}
.stepper button:active:not(:disabled){background:rgba(255,255,255,.14)}
.stepper button:disabled{opacity:.28}
.stepper span{min-width:34px;text-align:center;font-size:20px;font-weight:800}
.switch{width:58px;height:34px;border-radius:99px;border:1px solid var(--line);background:rgba(255,255,255,.08);position:relative;cursor:pointer;flex:none;padding:0}
.switch span{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:#8e84b3;transition:right .18s}
.switch.on{background:linear-gradient(135deg,var(--gold),var(--gold2));border-color:transparent}
.switch.on span{right:28px;background:#1b1206}
.seg{display:flex;gap:6px;flex:none}
.seg button{border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--mut);border-radius:12px;padding:0 11px;height:40px;font-size:13.5px;cursor:pointer}
.seg button.on{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1b1206;border-color:transparent;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:8px 0 4px}
.chip{border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--ink);border-radius:99px;padding:0 14px;height:40px;font-size:14px;cursor:pointer}
.chip.on{background:rgba(107,76,255,.3);border-color:rgba(107,76,255,.75)}
.names{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 0 14px}
.nm{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:12px;color:var(--ink);padding:0 12px;height:46px;font-size:16px;min-width:0}
.nm::placeholder{color:#6f6790}
.nm:focus{outline:none;border-color:rgba(107,76,255,.9);background:rgba(107,76,255,.12)}
.cta{
  position:fixed;left:0;right:0;bottom:0;z-index:20;pointer-events:none;
  padding:10px var(--pad) calc(10px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(to top,rgba(8,7,15,.97) 38%,rgba(8,7,15,.88) 70%,rgba(8,7,15,0));
}
.cta-in{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:8px;pointer-events:auto}
.big{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:58px;padding:14px 16px;
  border:0;border-radius:16px;font-size:18px;font-weight:800;line-height:1.25;color:#1b1206;text-decoration:none;
  background:linear-gradient(135deg,var(--gold),var(--gold2));
  box-shadow:0 14px 30px -12px rgba(255,150,60,.75);cursor:pointer;transition:transform .12s ease;
}
.big:active{transform:scale(.98)}
.big:disabled{opacity:.4;box-shadow:none;cursor:default}
.room-code{font-size:38px;font-weight:900;letter-spacing:8px;text-align:center;margin:10px 0 4px;color:var(--gold);font-variant-numeric:tabular-nums}
.plist{display:flex;flex-wrap:wrap;gap:8px;padding:10px 0 4px}
.plist span{background:rgba(107,76,255,.18);border:1px solid rgba(107,76,255,.45);border-radius:12px;padding:8px 12px;font-size:14px;font-weight:700}
.plist span.me{background:rgba(255,194,71,.16);border-color:rgba(255,194,71,.5)}
.ghost{
  display:flex;align-items:center;justify-content:center;width:100%;min-height:46px;padding:10px 14px;
  background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--ink);border-radius:14px;font-size:15px;cursor:pointer;text-decoration:none
}
.ghost:active{background:rgba(255,255,255,.1)}
.foot{color:var(--mut);font-size:12px;text-align:center;line-height:1.6;margin-top:4px}
.pass-ico{font-size:46px;line-height:1}
.pname{font-size:clamp(26px,8vw,34px);font-weight:900;margin:2px 0;line-height:1.2;word-break:break-word}
.pname.small{font-size:14px;color:var(--mut);font-weight:600;margin:0}
.cardbox{
  flex:1 1 auto;min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  background:linear-gradient(165deg,rgba(107,76,255,.24),rgba(255,255,255,.04));
  border:1px solid var(--line);border-radius:24px;padding:28px 18px;margin:6px 0;
}
.cardbox.imp{background:linear-gradient(165deg,rgba(255,95,126,.24),rgba(255,255,255,.04));border-color:rgba(255,95,126,.45)}
.tag{font-size:13px;color:var(--mut);letter-spacing:.3px}
.word{font-size:clamp(32px,11vw,46px);font-weight:900;line-height:1.25;word-break:break-word}
.ring{
  --p:1;width:min(60vw,180px);aspect-ratio:1;border-radius:50%;margin:4px auto 0;
  background:conic-gradient(var(--gold) calc(var(--p)*1turn),rgba(255,255,255,.08) 0);
  display:grid;place-items:center;padding:7px;
}
.ring-in{width:100%;height:100%;border-radius:50%;background:#110e1d;display:flex;flex-direction:column;align-items:center;justify-content:center}
.clock{font-size:clamp(28px,8.5vw,38px);font-weight:900;font-variant-numeric:tabular-nums;line-height:1.1}
.clock.over{font-size:clamp(17px,4.6vw,21px);color:var(--bad);padding:0 8px}
.tag2{font-size:11.5px;color:var(--mut);letter-spacing:1.6px}
.tips{margin:4px 0 10px;padding-inline-start:16px;color:var(--mut);line-height:1.75;font-size:13.5px}
.tips li{margin-bottom:6px}
.imp-list{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:8px}
.imp-list span{background:rgba(255,95,126,.18);border:1px solid rgba(255,95,126,.55);border-radius:12px;padding:9px 14px;font-weight:700;font-size:15px}
.recbar{display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--bad);font-weight:700;padding:12px 0}
.dot{width:9px;height:9px;border-radius:50%;background:var(--bad);animation:blink 1s infinite;flex:none}
@keyframes blink{50%{opacity:.15}}
.pv{width:100%;border-radius:14px;background:#000;max-height:210px;object-fit:cover;display:block;margin-bottom:12px}
/* iOS Safari: شريط التنقل السفلي كيغطي آخر 44px من الشاشة */
@supports (-webkit-touch-callout:none){
  .cta{padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
  .wrap{padding-bottom:calc(var(--cta) + 20px + env(safe-area-inset-bottom,0px))}
}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (max-height:680px){
  .hero p{display:none}
  .cardbox{min-height:170px;padding:18px}
  .tips li:nth-child(n+3){display:none}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
const CATS = {
  "حيوانات":["أسد","فيل","قطة","كلب","جمل","حصان","تمساح","زرافة","قرد","دلفين","نعامة","ثعبان","نحلة","عصفور","ذيب","خروف","بقرة","عقرب","سمكة","بومة","سلحفاة","خنزير","أرنب","فهد"],
  "طعام":["كسكس","طاجين","حريرة","بيتزا","شاورما","برغر","ملوخية","مسمن","بغرير","أتاي","قهوة","حلوى","دلاح","رمان","زيتون","خبز","دجاج محمر","عصير","مثلجات","فريت","سردين","كفتة","بسطيلة","شكلاطة"],
  "بلدان":["المغرب","مصر","السعودية","فرنسا","إسبانيا","تركيا","اليابان","البرازيل","الصين","الهند","أمريكا","الجزائر","تونس","كندا","إيطاليا","ألمانيا","روسيا","المكسيك","السنغال","قطر"],
  "رياضة":["كرة القدم","كرة السلة","تنس","سباحة","جري","ملاكمة","كمال الأجسام","ركوب الدراجة","جودو","كرة اليد","غولف","تزلج","كريكيت","رغبي","شطرنج","مصارعة","جمباز","كرة الطائرة","رماية","فورمولا 1"],
  "أفلام":["تايتانيك","الأسد الملك","هاري بوتر","أفاتار","سبايدرمان","باتمان","جوكر","إنسبشن","سيد الخواتم","فاست أند فيورس","شرلوك","صراع العروش","لالاند","بريزون بريك","مونانا","فريزون","شريك","ماما ميا","وادي الذئاب","الأصدقاء"],
  "مهن":["طبيب","أستاذ","طيار","بحّار","طباخ","حلاق","نجار","مهندس","شرطي","ممرض","سائق طاكسي","فلاح","صحافي","محامي","بائع","صيدلي","ميكانيكي","رسام","مغني","حارس"],
  "أماكن":["مطار","مستشفى","سوق","مسجد","شاطئ","مدرسة","بنك","محطة القطار","صيدلية","مطعم","حديقة","متحف","سجن","فندق","ملعب","مقهى","سينما","مكتبة","مراكش","حلاق"],
  "أشياء":["تيليفون","مفتاح","مرايا","كرسي","طاولة","ساعة","قلم","محفظة","نظارة","حذاء","قبعة","مظلة","تلفاز","ثلاجة","مكواة","شنطة","خاتم","سكين","وسادة","شمعة","مكنسة","بوصلة"],
  "مشاهير":["ميسي","رونالدو","نيمار","محمد صلاح","حكيمي","زياش","مايكل جاكسون","شاكيرا","بيونسيه","تايلور سويفت","دريك","إيلون ماسك","بيل غيتس","أوباما","رونالدينيو","زيدان","مبابي","سيلينا غوميز","أديل","براد بيت"],
  "ماركات":["نايكي","أديداس","آبل","سامسونج","كوكاكولا","بيبسي","ماكدونالدز","ستاربكس","نتفليكس","يوتيوب","فيسبوك","إنستغرام","تويوتا","مرسيدس","شانيل","غوتشي","إيكيا","أمازون","تيك توك","ريد بُل"],
  "أنمي":["ناروتو","ون بيس","دراغون بول","ديث نوت","أتاك أون تايتن","ديمون سلاير","جوجوتسو كايسن","بليتش","هنتر إكس هنتر","ماي هيرو أكاديميا","سباير إكس فاميلي","توكيو غول","بوكيمون","سايلور مون","فولميتال ألكيميست","بلاك كلوفر","هايكيو","سورد آرت أونلاين","تشينسو مان","إيفانجيليون"],
  "ألعاب فيديو":["فورتنايت","ماينكرافت","جي تي إيه","كول أوف ديوتي","فيفا","ببجي","روبلوكس","ماريو","زيلدا","أساسينز كريد","غود أوف وار","ريد ديد","ذا ويتشر","كاندي كراش","سابواي سيرفرز","كلاش أوف كلانس","مورتال كومبات","تيكن","فول قايز","أمونغ أس"]
};
const ALL = Object.keys(CATS);
const KEY = "mn_almo7tal_v1";

let S = { players: 5, impostors: 1, chaos: false, cats: ALL.slice(), timer: 120, names: [], mode: "local", hostName: "" };
try { Object.assign(S, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) {}
if (!S.cats || !S.cats.length) S.cats = ALL.slice();
if (!Array.isArray(S.names)) S.names = [];
if (S.mode === "online") S.mode = "local";

let G = null;          // round state
let view = "setup";
let timerId = null;
let rec = null;        // active MediaRecorder session
let recUrl = null;     // last recording blob url

let mqttClient = null, clientId = "", netStatus = "idle";
const BROKERS = [
  "wss://broker.emqx.io:8084/mqtt",
  "wss://broker.hivemq.com:8884/mqtt",
  "wss://broker.emqx.io:443/mqtt"
];
let netRole = null;    // "host" | "guest" | null
let roomCode = "", players = [], readyCount = 0, readyIds = new Set();
let joinCode = (new URLSearchParams(location.search).get("room") || "").toUpperCase();
let guestName = "";
try { guestName = localStorage.getItem("mn_guest_name") || ""; } catch (e) {}
const isGuest = () => netRole === "guest";
const topic = () => "mn-almo7tal/v1/" + roomCode;
const send = d => { if (mqttClient && roomCode) { try { mqttClient.publish(topic(), JSON.stringify({ ...d, from: clientId })); } catch (e) {} } };
const broadcast = send;

const app = document.getElementById("app");
const rnd = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
const fmt = s => Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
const name = i => ((S.names[i] || "").trim() || "لاعب " + (i + 1));
const esc = v => (v || "").replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");

function genCode() { return Math.random().toString(36).slice(2, 7).toUpperCase(); }

function loadMqtt(cb) {
  if (window.mqtt) return cb();
  const s = document.createElement("script");
  s.src = "mqtt.min.js";
  s.onload = cb;
  s.onerror = () => alert("ما قدرناش نحمّلو مكتبة الاتصال. تأكد من الإنترنت.");
  document.head.appendChild(s);
}

function connectMqtt(code, role, after, attempt = 0) {
  loadMqtt(() => {
    if (attempt >= BROKERS.length) {
      netStatus = "error";
      alert("ما قدرناش نتصلو بالأونلاين. تأكد من الإنترنت وجرّب مرة أخرى.");
      show(view);
      return;
    }
    roomCode = code; netRole = role; netStatus = "connecting";
    if (view === "setup" || view === "join") show(view);
    clientId = "m7l" + Math.random().toString(36).slice(2, 12);
    const m = window.mqtt.connect(BROKERS[attempt], {
      clientId, clean: true, keepalive: 30, connectTimeout: 3500, reconnectPeriod: 2000
    });
    mqttClient = m;
    let settled = false;
    const fail = () => {
      if (settled || m !== mqttClient) return;
      settled = true; clearTimeout(timer);
      try { m.end(true); } catch (e) {}
      connectMqtt(code, role, after, attempt + 1);
    };
    const timer = setTimeout(fail, 3500);
    m.on("connect", () => m.subscribe(topic(), { qos: 1 }, err => {
      if (settled || m !== mqttClient) return;
      if (err) return fail();
      settled = true; clearTimeout(timer); netStatus = "online"; after();
    }));
    m.on("message", (t, buf) => {
      if (m !== mqttClient || t !== topic()) return;
      let d;
      try { d = JSON.parse(buf.toString()); } catch (e) { return; }
      if (!d || d.from === clientId || (d.to && d.to !== clientId)) return;
      if (netRole === "host") onHostData(d); else onGuestData(d);
    });
    m.on("error", fail);
    m.on("offline", () => { if (!settled) fail(); else { netStatus = "error"; show(view); } });
    m.on("reconnect", () => { if (settled) { netStatus = "connecting"; show(view); } });
  });
}

function closeNet() {
  if (netRole === "host") send({ t: "stop" });
  if (netRole === "guest") send({ t: "bye" });
  if (mqttClient) { try { mqttClient.end(true); } catch (e) {} }
  mqttClient = null; clientId = ""; netRole = null;
  players = []; roomCode = ""; readyCount = 0; readyIds = new Set(); netStatus = "idle";
}

function shareLink() {
  const url = location.origin + location.pathname + "?room=" + roomCode;
  if (navigator.share) navigator.share({ title: "من المحتال؟", url }).catch(() => {});
  else if (navigator.clipboard) navigator.clipboard.writeText(url).then(() => alert("تم نسخ الرابط")).catch(() => prompt("انسخ الرابط:", url));
  else prompt("انسخ الرابط:", url);
}

function createRoom() {
  if (netRole) return;
  connectMqtt(genCode(), "host", () => show("setup"));
}

function joinRoom(code, name) {
  if (netRole) return;
  netRole = "guest"; roomCode = code; guestName = name;
  try { localStorage.setItem("mn_guest_name", guestName); } catch (e) {}
  connectMqtt(code, "guest", () => { send({ t: "hello", name: guestName }); show("wait"); });
}

function onHostData(d) {
  if (d.t === "hello") {
    if (players.length >= 19 || players.some(p => p.id === d.from)) return;
    players.push({ id: d.from, name: d.name || "لاعب" });
    if (view === "setup") show("setup");
  } else if (d.t === "rename") {
    const p = players.find(x => x.id === d.from);
    if (p) { p.name = d.name || p.name; if (view === "setup") show("setup"); }
  } else if (d.t === "ready" && view === "wait") {
    readyIds.add(d.from); readyCount = readyIds.size;
    if (readyCount >= players.length) beginDiscussHost(); else show("wait");
  } else if (d.t === "bye") {
    players = players.filter(p => p.id !== d.from);
    readyIds.delete(d.from); readyCount = readyIds.size;
    if (view === "setup") show("setup");
  }
}

function onGuestData(d) {
  if (!d) return;
  if (d.t === "card") {
    G = { cat: d.cat, word: d.word, imp: d.imp ? [d.idx] : [], i: d.idx, names: d.names, duration: 0, left: 0 };
    show("card");
  } else if (d.t === "discuss") {
    G.duration = d.duration; G.startName = d.startName; G.left = d.duration;
    show("discuss");
  } else if (d.t === "reveal") {
    G.word = d.word; G.cat = d.cat; G.imp = []; G.impNames = d.impostors;
    show("reveal");
  } else if (d.t === "starter") {
    G.startName = d.startName;
    const el = document.querySelector(".row .pname");
    if (el) el.textContent = d.startName;
  } else if (d.t === "newround") show("wait");
  else if (d.t === "stop") { alert("المضيف خرج من الغرفة"); closeNet(); show("join"); }
}

function buildRound(n) {
  const cats = S.cats.length ? S.cats : ALL;
  const cat = pick(cats);
  const k = S.chaos ? 1 + rnd(Math.min(3, n - 1)) : Math.min(S.impostors, n - 1);
  const idx = Array.from({ length: n }, (_, i) => i);
  for (let i = idx.length - 1; i > 0; i--) { const j = rnd(i + 1); [idx[i], idx[j]] = [idx[j], idx[i]]; }
  return { cat, word: pick(CATS[cat]), imp: idx.slice(0, k) };
}

function beginDiscussHost() {
  broadcast({ t: "discuss", startName: name(G.start), duration: S.timer });
  show("discuss");
}

function hostNewRound() {
  const names = [(S.hostName || "").trim() || "المضيف", ...players.map(p => p.name)];
  const r = buildRound(names.length);
  G = { ...r, i: 0, names, start: rnd(names.length), duration: S.timer, left: 0 };
  readyIds = new Set(); readyCount = 0;
  players.forEach((p, i) => {
    const pi = i + 1, imp = r.imp.includes(pi);
    send({ t: "card", word: imp ? null : r.word, cat: r.cat, imp, idx: pi, names, to: p.id });
  });
  show("card");
}

function hostReveal() {
  broadcast({ t: "reveal", word: G.word, cat: G.cat, impostors: G.imp.map(i => G.names[i]) });
  show("reveal");
}

function hostNextRound() {
  broadcast({ t: "newround" });
  recGen++; if (rec) rec.mr.stop(); recUrl = null;
  hostNewRound();
}

function show(v) {
  clearInterval(timerId); timerId = null;
  if (v !== "discuss" && rec) rec.mr.stop();
  const sameView = v === view;
  view = v;
  app.innerHTML = views[v]();
  if (!sameView) window.scrollTo(0, 0);
  if (v === "discuss") {
    if (isGuest() ? G.duration : S.timer) startTimer();
    if (!isGuest()) renderRec();
  }
}

let recGen = 0;

async function startRec() {
  if (!navigator.mediaDevices || !window.MediaRecorder) {
    alert("هاد المتصفح ما كيدعمش التسجيل.");
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: true });
    const type = ["video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm", "video/mp4"]
      .find(t => MediaRecorder.isTypeSupported(t)) || "";
    const mr = new MediaRecorder(stream, type ? { mimeType: type } : undefined);
    const chunks = [], gen = ++recGen;
    mr.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
    mr.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      rec = null;
      if (gen !== recGen) return;
      recUrl = URL.createObjectURL(new Blob(chunks, { type: type || "video/webm" }));
      if (view === "discuss") renderRec();
      else if (view === "reveal") app.innerHTML = views.reveal();
    };
    mr.start();
    rec = { mr, stream };
    renderRec();
  } catch (e) {
    alert("ما قدرناش نوصلو للكاميرا: " + (e.message || e));
  }
}

function renderRec() {
  const el = document.getElementById("rec");
  if (!el) return;
  if (rec) {
    el.innerHTML = `<div class="card" style="padding:0 14px 14px"><div class="recbar"><span class="dot"></span> كنسجّلو…<button class="ghost" style="width:auto;min-height:38px;margin-inline-start:auto" data-act="recstop">وقّف</button></div><video id="pv" class="pv" autoplay muted playsinline></video></div>`;
    document.getElementById("pv").srcObject = rec.stream;
  } else if (recUrl) {
    el.innerHTML = `<div class="card" style="padding:14px"><div class="lbl">🎥 الفيديو جاهز</div><div class="hint" style="margin:4px 0 10px">حمّلو وشاركو مع الصحاب.</div><a class="ghost" href="${recUrl}" download="reaction.webm">حمّل الفيديو</a></div>`;
  } else {
    el.innerHTML = `<button class="ghost" data-act="recstart">🎥 سجّل ردة الفعل</button>`;
  }
}

function startTimer() {
  const dur = isGuest() ? G.duration : S.timer;
  G.left = dur;
  const el = document.getElementById("clock");
  const ring = document.getElementById("ring");
  const paint = () => ring && ring.style.setProperty("--p", dur ? Math.max(0, G.left / dur) : 1);
  if (!el) return;
  paint();
  timerId = setInterval(() => {
    G.left--;
    if (G.left <= 0) {
      clearInterval(timerId); timerId = null;
      paint();
      el.textContent = "خلص الوقت!";
      el.classList.add("over");
      return;
    }
    paint();
    el.textContent = fmt(G.left);
  }, 1000);
}

function newRound() {
  recGen++; if (rec) rec.mr.stop(); recUrl = null;
  const r = buildRound(S.players);
  G = { ...r, i: 0, start: rnd(S.players), left: 0, duration: S.timer };
  show("pass");
}

app.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const a = el.dataset.act, v = el.dataset.val;
  const pc = netRole === "host" ? players.length + 1 : S.players;

  if (a === "p-") S.players = Math.max(3, S.players - 1);
  else if (a === "p+") S.players = Math.min(20, S.players + 1);
  else if (a === "i-") S.impostors = Math.max(1, S.impostors - 1);
  else if (a === "i+") S.impostors = Math.min(3, pc - 1, S.impostors + 1);
  else if (a === "chaos") S.chaos = !S.chaos;
  else if (a === "t") S.timer = +v;
  else if (a === "cat") {
    S.cats = S.cats.includes(v) ? S.cats.filter(c => c !== v) : [...S.cats, v];
  }
  else if (a === "mode") {
    if (v === S.mode) return;
    S.mode = v;
    if (v === "online") createRoom(); else closeNet();
    localStorage.setItem(KEY, JSON.stringify(S));
    show("setup"); return;
  }
  else if (a === "share") { shareLink(); return; }
  else if (a === "retry") {
    if (netRole === "host") { const c = roomCode || genCode(); closeNet(); connectMqtt(c, "host", () => show("setup")); }
    else { closeNet(); show("wait"); joinRoom(joinCode, guestName || "ضيف"); }
    return;
  }
  else if (a === "rename") {
    const el = document.getElementById("myName");
    const nv = (el && el.value || "").trim();
    if (nv) {
      guestName = nv;
      try { localStorage.setItem("mn_guest_name", nv); } catch (e) {}
      send({ t: "rename", name: nv });
      if (el) el.blur();
    }
    return;
  }
  else if (a === "leave") { closeNet(); show("join"); return; }
  else if (a === "join") {
    const code = (document.getElementById("joinCode").value || "").trim().toUpperCase().replace(/^M7L-/, "");
    const nm = (document.getElementById("joinName").value || "").trim() || "لاعب";
    if (!code) { alert("دخل رمز الغرفة"); return; }
    joinCode = code; joinRoom(code, nm); return;
  }
  else if (a === "start") { netRole === "host" ? hostNewRound() : newRound(); return; }
  else if (a === "card") { show("card"); return; }
  else if (a === "ready") { send({ t: "ready" }); show("wait"); return; }
  else if (a === "hide") {
    if (netRole === "host") show("wait");
    else if (G.i + 1 < S.players) { G.i++; show("pass"); }
    else show("discuss");
    return;
  }
  else if (a === "randstart") {
    G.start = rnd(netRole === "host" ? players.length + 1 : S.players);
    const nm2 = name(G.start);
    app.querySelector(".row .pname").textContent = nm2;
    if (netRole === "host") broadcast({ t: "starter", startName: nm2 });
    return;
  }
  else if (a === "nextround") { hostNextRound(); return; }
  else if (a === "recstart") { startRec(); return; }
  else if (a === "recstop") { if (rec) rec.mr.stop(); return; }
  else if (a === "reveal") { netRole === "host" ? hostReveal() : show("reveal"); return; }
  else if (a === "setup") { show("setup"); return; }

  if (S.impostors > S.players - 1) S.impostors = Math.max(1, S.players - 1);
  localStorage.setItem(KEY, JSON.stringify(S));
  show("setup");
});

app.addEventListener("input", e => {
  if (e.target.id === "hostName") {
    S.hostName = e.target.value;
    localStorage.setItem(KEY, JSON.stringify(S));
    return;
  }
  const el = e.target.closest(".nm");
  if (!el || !el.dataset.i) return;
  S.names[+el.dataset.i] = el.value;
  localStorage.setItem(KEY, JSON.stringify(S));
});

if (joinCode) {
  guestName = guestName || ("ضيف" + (10 + rnd(90)));
  joinRoom(joinCode, guestName);
  show("wait");
} else show("setup");
</script>
